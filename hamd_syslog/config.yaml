name: IoT Syslog
version: "0.1.2"
slug: hamd_syslog
description: Encrypted, searchable syslog collection for IoT devices
url: https://github.com/IanW6374/HA-IoT-Syslog/tree/main/hamd_syslog
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
stage: experimental
backup: cold
ingress: true
ingress_port: 8099
panel_icon: mdi:text-box-search-outline
panel_title: IoT Syslog
panel_admin: true
ports:
  514/udp: 514
  6514/tcp: 6514
ports_description:
  514/udp: Unencrypted syslog (disabled by default)
  6514/tcp: Encrypted syslog over TLS
map:
  - type: ssl
    read_only: true
options:
  udp_enabled: false
  tls_enabled: true
  tls_mode: generated
  tls_server_names: homeassistant.local
  tls_certificate: fullchain.pem
  tls_private_key: privkey.pem
  tls_ca_certificate: iot-ca-root.pem
  retention_days: 30
  purge_interval_hours: 6
  max_message_kib: 64
schema:
  udp_enabled: bool
  tls_enabled: bool
  tls_mode: list(generated|custom)
  tls_server_names: str
  tls_certificate: str
  tls_private_key: str
  tls_ca_certificate: str
  retention_days: int(1,3650)
  purge_interval_hours: int(1,168)
  max_message_kib: int(1,1024)
image: ghcr.io/ianw6374/hamd-syslog
